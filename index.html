<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>AstraNova｜RoomTalk</title>
  <link rel="stylesheet" href="styles.css?v=46">
</head>
<body>
  <main class="app-shell">
    <header class="site-header">
      <div>
        <p class="eyebrow">AstraNova</p>
        <h1><span class="title-room">Room</span><span class="title-talk">Talk</span></h1>
      </div>
      <div class="header-actions">
        <div data-language-switcher></div>
        <button class="button button-quiet audio-toggle" id="bgm-button"
          type="button" aria-label="關閉背景音樂" aria-pressed="true" title="背景音樂：開啟">
          <span class="audio-toggle-icon" aria-hidden="true">🎵</span>
        </button>
        <button class="button button-quiet audio-toggle" id="sfx-button"
          type="button" aria-label="關閉音效" aria-pressed="true" title="音效：開啟">
          <span class="audio-toggle-icon" aria-hidden="true">🔊</span>
        </button>
        <button class="button button-quiet" id="memory-button">回想</button>
        <button class="button button-quiet" id="reset-button">重置</button>
      </div>
    </header>

    <div class="game-layout">
      <aside class="character-panel">
        <h2>選擇房間</h2>
        <div id="character-list" class="character-list"></div>
        <p class="helper-text">點擊角色卡片切換房間，點擊角色或選項開始對話。</p>
      </aside>

      <section id="room" class="room-stage"></section>
    </div>
  </main>

  <div id="memory-overlay" class="overlay hidden">
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="memory-title">
      <button class="button button-quiet close-button" id="close-memory"
        type="button" aria-label="關閉事件回想" title="關閉">×</button>
      <div class="modal-content">
        <header class="modal-heading">
          <p class="eyebrow">MEMORY</p>
          <h2 id="memory-title">事件回想</h2>
          <p class="helper-text">完成過的事件會永久收錄在這裡。</p>
        </header>
        <div id="memory-list" class="memory-list"></div>
      </div>
    </section>
  </div>

  <audio id="bgm" src="assets/audio/AstraNova-BGM.mp3?v=1" loop preload="auto"></audio>

  <script src="data.js?v=21"></script>
  <script src="content-asteria.js?v=6"></script>
  <script src="content-nyx.js?v=5"></script>
  <script src="content-lumi.js?v=5"></script>
  <script src="app.js?v=24"></script>
  <script src="language-packs.js?v=1"></script>
  <script src="i18n.js?v=1"></script>
</body>
</html>
